<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Prompt Orchestrator — Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h2>Settings</h2>
  <label>API base URL</label>
  <input id="apiBase" type="url" placeholder="https://your-app.vercel.app" />
  <label style="margin-top:8px; display:block;">API key</label>
  <input id="apiKey" type="text" placeholder="dev-extension-key" />
  <button id="save" style="margin-top:10px;">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>

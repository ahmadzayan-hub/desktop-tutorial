<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1F12"/>
      <stop offset="55%" stop-color="#162A18"/>
      <stop offset="100%" stop-color="#0B1A0E"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7BB94A"/>
      <stop offset="55%" stop-color="#9FCD63"/>
      <stop offset="100%" stop-color="#D4F08C"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7BB94A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9FCD63"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#F4B63E"/>
      <stop offset="100%" stop-color="#D4F08C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#t)" stroke="#9FCD63" stroke-opacity="0.55" stroke-width="1.2"/>
  <!-- Aurora arc — Pitchora signature -->
  <path d="M10 22 Q32 8 54 22" fill="none" stroke="url(#aurora)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Rising line (the "pitch") -->
  <path d="M16 46 L24 39 L32 42 L40 31 L48 24" fill="none" stroke="url(#l)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <path d="M42 24 L48 24 L48 30" fill="none" stroke="#F4B63E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Aurora sparkles -->
  <circle cx="18" cy="18" r="1.6" fill="#D4F08C"/>
  <circle cx="50" cy="38" r="1.4" fill="#A5B4FC"/>
  <circle cx="38" cy="14" r="1.2" fill="#F4B63E"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wisal — وصال">
  <!-- «The Living Link»: خطّان مستديران بيتقابلوا ويتشابكوا — جسر على شكل W
       ومساحة قلب مفتوحة في النص. متوازن بصريًا في RTL وLTR. -->
  <defs>
    <clipPath id="lobeL"><path d="M0 0H256V512H0z"/></clipPath>
    <clipPath id="lobeR"><path d="M256 0H512V512H256z"/></clipPath>
  </defs>

  <!-- الذراع اليسرى: كورال -->
  <path d="M84 176 L164 344 L256 196"
        fill="none" stroke="#FF6E72" stroke-width="78"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- الذراع اليمنى: تيل -->
  <path d="M256 196 L348 344 L428 176"
        fill="none" stroke="#35B8A6" stroke-width="78"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- نقطة الالتقاء: عنبر — لحظة الوصال -->
  <circle cx="256" cy="204" r="58" fill="#F2C56B"/>

  <!-- القلب المفتوح في قلب الالتقاء -->
  <path d="M256 238c-9-16-38-24-38-46 0-13 10-22 22-22 8 0 13 4 16 9 3-5 8-9 16-9 12 0 22 9 22 22 0 22-29 30-38 46z"
        fill="#F8F5EF"/>
</svg>

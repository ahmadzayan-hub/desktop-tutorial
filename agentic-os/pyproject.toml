[project]
name = "agentic-os"
version = "0.1.0"
description = "Tool-agnostic Agentic OS: governed orchestration, memory, security, and verification for this workspace"
readme = "README.md"
# Spec asks for Python 3.12; this environment provides 3.11 and the code is
# compatible with both. Raise to ">=3.12" once the runtime is upgraded.
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ahmed Zaian" }]
dependencies = []  # stdlib-only by design: secure defaults, no install approval needed

[project.scripts]
agentic-os = "agentic_os.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

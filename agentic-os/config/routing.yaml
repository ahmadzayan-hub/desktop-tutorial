# Routing policy (spec section 10). Enforced by src/agentic_os/orchestration/router.py
defaults:
  extraction: light
  classification: light
  formatting: light
  scanning: light
  triage: light
  coding: standard
  drafting: standard
  synthesis: standard
  tool-use: standard
  report-assembly: standard
  architecture: heavy
  high-risk-analysis: heavy
  executive-decision: heavy
  strategic-writing: heavy
  verification: verifier
rules:
  corrected-retries-at-same-role: 1
  escalate-on-capability-failure: true
  heavy-call-approval-threshold: 4  # the fourth HEAVY call needs approval
  log-provider-outage-retries: true

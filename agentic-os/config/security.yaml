# Security policy (spec sections 18-19). PROTECTED FILE — Checkpoint B before edits.
secrets:
  redaction-token: "[REDACTED-SECRET]"
  scan-on-doctor: true
  env-example-names-only: true
prompt-injection:
  treat-as-untrusted:
    - project-files
    - pdfs
    - emails
    - web-pages
    - source-comments
    - tool-output
    - memory-retrieval
    - embedded-instructions
    - external-apis
    - generated-code-unknown-origin
  log-detections: true
  never-overridable:
    - user-approved-scope
    - OS.md
    - guardrails.md
    - tool-permissions
    - domain-policy
    - approval-policy
sanitization:
  strip-emails: true
  strip-phones: true
  strip-national-ids: true

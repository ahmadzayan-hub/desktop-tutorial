# Approval checkpoints (spec section 3). PROTECTED FILE — Checkpoint B before edits.
checkpoints:
  A:
    name: migration-approval
    required-before:
      - move
      - rename
      - archive
      - modify-project-files
  B:
    name: protected-configuration-approval
    protected-files:
      - agentic-os/OS.md
      - agentic-os/guardrails.md
      - agentic-os/config/domains.yaml
      - agentic-os/config/approval-policy.yaml
      - agentic-os/config/security.yaml
  C:
    name: environment-changing-approval
    required-before:
      - install-packages
      - change-system-configuration
      - database-migrations
      - modify-ci-cd
      - cloud-resources
      - production-access
      - deploy
      - merge-protected-branch
  D:
    name: external-or-destructive-approval
    required-before:
      - email
      - publish
      - social-media
      - send-messages
      - third-party-production-writes
      - delete
      - force-push
      - overwrite-unrecoverable-data
      - payments
default-autonomy: draft
never-delete-files: true

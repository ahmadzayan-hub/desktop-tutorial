# Domain policy (spec section 5). PROTECTED FILE — Checkpoint B before edits.
domains:
  system:
    scope: Agentic OS, tools, governance, infrastructure, migration, shared technical templates
    default-classification: internal
  rta:
    scope: RTA, railway, metro, tram, signalling, operations, government work
    default-classification: restricted
  bcgt:
    scope: Beyond Connect General Trading activities
    default-classification: confidential
  mba:
    scope: MBA study and academic work
    default-classification: internal
  brand:
    scope: Beyond Style UAE and public personal-brand content
    default-classification: internal
  personal:
    scope: Private non-business matters
    default-classification: confidential
rules:
  one-primary-domain-per-task: true
  one-domain-per-knowledge-file: true
  decompose-cross-domain-requests: true
  rta-export-requires-explicit-approval: true
  cross-domain-via-exchange-only: true

# Verification levels (spec section 15). Enforced by src/agentic_os/verification/.
levels:
  none:
    use-for: non-material brainstorming only
  basic:
    checks:
      - structure
      - formatting
      - file-integrity
      - obvious-contradictions
  standard:
    checks:
      - contract
      - material-facts
      - calculations
      - sources
      - domain-isolation
  enhanced:
    checks:
      - independent-sources
      - deterministic-validation
      - full-calculations
      - classification
      - security
      - domain-isolation
      - approvals
  human-mandatory:
    checks:
      - all-enhanced-checks
      - explicit-human-approval
high-risk-minimum-level: enhanced

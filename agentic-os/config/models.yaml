# Model map (spec: USER CONFIGURATION). Only models actually available in the
# active coding tool are named. usage-type is "unknown" until the owner
# confirms API vs subscription billing. Documented in llms/llm-config.md.
models:
  orchestrator:
    model: claude-fable-5
    provider: Anthropic
    usage-type: unknown
    purpose: user communication, decomposition, routing, review, merge, memory maintenance
  heavy:
    model: claude-fable-5
    provider: Anthropic
    usage-type: unknown
    purpose: architecture, high-stakes analysis, strategic writing, difficult escalations
  standard:
    model: claude-sonnet-5
    provider: Anthropic
    usage-type: unknown
    purpose: coding, drafting, research synthesis, tool calling, report assembly
  light:
    model: claude-haiku-4-5-20251001
    provider: Anthropic
    usage-type: unknown
    purpose: extraction, scanning, formatting, classification, triage
  verifier:
    model: claude-sonnet-5
    provider: Anthropic
    usage-type: unknown
    purpose: independent verification and contract checking (separate context)
single-model-fallback: true  # if only one model is available, roles remain behavioral modes

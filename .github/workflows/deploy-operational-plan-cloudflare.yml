# Deploys operational-plan/ to Cloudflare Pages.
# Free tier, works with private repos, no build step needed.
#
# One-time setup (~ 2 minutes):
#   1. Create a Cloudflare account (dash.cloudflare.com), free tier.
#   2. Cloudflare dashboard → Workers & Pages → Create → Pages → "Direct
#      Upload". Name the project e.g. "operational-plan". Note the name.
#   3. Cloudflare → My Profile → API Tokens → Create Token → "Edit
#      Cloudflare Workers" template (or a custom token with
#      Account → Cloudflare Pages → Edit permission). Copy the token.
#   4. Cloudflare dashboard homepage → right sidebar shows your Account ID.
#   5. In THIS repo: Settings → Secrets and variables → Actions → New
#      repository secret. Add:
#        CLOUDFLARE_API_TOKEN     = <token from step 3>
#        CLOUDFLARE_ACCOUNT_ID    = <account id from step 4>
#        CLOUDFLARE_PROJECT_NAME  = <project name from step 2>
#
# Once secrets are in place, this workflow deploys on every push to
# main touching operational-plan/**. Comment out the whole file OR
# leave the secrets empty to keep it dormant.

name: Deploy operational plan — Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-operational-plan
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — bail out cleanly if secrets are missing
        id: preflight
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" ] && missing="$missing CLOUDFLARE_PROJECT_NAME"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping Cloudflare deploy — missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.preflight.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy operational-plan --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-dirty=true

# Deploys operational-plan/ to Surge.sh — the simplest static host.
# Free tier, no signup dashboard needed, works with private repos.
#
# One-time setup (~ 60 seconds):
#   1. On your machine: npx surge whoami   # will prompt to create a
#      free account with email + password if you don't have one.
#      Then: npx surge token   # prints your API token to stdout.
#      Copy that token.
#   2. Choose a subdomain, e.g. operational-plan-2026.surge.sh (must
#      end in .surge.sh — subdomain is free and first-come-first-served).
#   3. In THIS repo: Settings → Secrets and variables → Actions →
#      New repository secret. Add:
#        SURGE_LOGIN   = <your surge email address>
#        SURGE_TOKEN   = <token from step 1>
#        SURGE_DOMAIN  = operational-plan-2026.surge.sh   (or your choice)
#
# Once secrets are in place, this workflow deploys on every push to
# main touching operational-plan/**.

name: Deploy operational plan — Surge.sh

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan-surge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-operational-plan
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — bail out cleanly if secrets are missing
        id: preflight
        run: |
          missing=""
          [ -z "${{ secrets.SURGE_LOGIN }}" ] && missing="$missing SURGE_LOGIN"
          [ -z "${{ secrets.SURGE_TOKEN }}" ] && missing="$missing SURGE_TOKEN"
          [ -z "${{ secrets.SURGE_DOMAIN }}" ] && missing="$missing SURGE_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping Surge deploy — missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.preflight.outputs.skip != 'true'
        name: Deploy operational-plan/ to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge ./operational-plan "${{ secrets.SURGE_DOMAIN }}"
          echo "::notice::Live at https://${{ secrets.SURGE_DOMAIN }}/"

# Publishes the operational-plan/ folder to GitHub Pages.
# Runs on every push to main that touches operational-plan/, and can
# be triggered manually from the Actions tab (workflow_dispatch).
#
# URL after first successful deploy:
#   https://ahmadzayan-hub.github.io/desktop-tutorial/
# (redirects to Annual_Operational_Plan_2026_V0_6.html via index.html)
#
# Shares the `pages` concurrency group with any other Pages workflow
# so only one Pages deployment runs at a time.
name: Deploy operational plan

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: configure
        # Non-fatal — Pages may not be available on the plan (private
        # repos need Pro / Team / Enterprise). If configure fails, the
        # subsequent steps are gated by `if: steps.configure.outcome == 'success'`
        # so the job ends green with a warning instead of red-badging
        # every push.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the folder directly — no build step. index.html
          # inside the folder redirects to the current release HTML.
          path: operational-plan

      - if: steps.configure.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - if: steps.configure.outcome != 'success'
        name: Pages skipped
        run: |
          echo "::warning::GitHub Pages is not available for this repo (likely a private-repo-plan restriction). Skipping deploy. Use one of the alternative workflows (Cloudflare / Vercel / Netlify / Surge) or make the repo public."


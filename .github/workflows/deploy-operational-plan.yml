# Publishes the operational-plan/ folder to GitHub Pages.
# Runs on every push to main that touches operational-plan/, and can
# be triggered manually from the Actions tab (workflow_dispatch).
#
# URL after first successful deploy:
#   https://ahmadzayan-hub.github.io/desktop-tutorial/
# (redirects to Annual_Operational_Plan_2026_V0_6.html via index.html)
#
# Shares the `pages` concurrency group with any other Pages workflow
# so only one Pages deployment runs at a time.
name: Deploy operational plan

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Attempts to enable Pages on first run. If the token lacks
          # permission, enable manually once in
          # Settings → Pages → Source: "GitHub Actions" and re-run.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the folder directly — no build step. index.html
          # inside the folder redirects to the current release HTML.
          path: operational-plan

      - id: deployment
        uses: actions/deploy-pages@v4


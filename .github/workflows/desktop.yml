name: Build Windows App

# بيبني برنامج وصال لويندوز (Electron) وينشر مثبّت جاهز.
# بيتشغّل لما تعدّل حاجة في wisal-desktop/ أو يدوياً من تبويب Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "wisal-desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wisal-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable
        run: npx electron-builder --win --publish never

      - name: List output
        run: dir dist
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisal-windows
          path: |
            wisal-desktop/dist/Wisal-Setup.exe
            wisal-desktop/dist/Wisal-Portable.exe
          if-no-files-found: error

      # رابط تنزيل ثابت لأحدث نسخة ويندوز.
      - name: Publish rolling release (Windows)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "وصال لويندوز (Wisal for Windows)"
          body: |
            برنامج وصال لويندوز.
            • Wisal-Setup.exe — تثبيت عادي بدون صلاحيات أدمن.
            • Wisal-Portable.exe — نسخة محمولة تشتغل من غير تثبيت.
            أول تشغيل ممكن Windows SmartScreen يحذّر لأن البرنامج مش موقّع تجارياً — اضغط More info ثم Run anyway.
          files: |
            wisal-desktop/dist/Wisal-Setup.exe
            wisal-desktop/dist/Wisal-Portable.exe
          make_latest: false

# Deploys operational-plan/ to a DEDICATED Vercel project (separate
# from the Maktab Next.js Vercel project that currently errors on the
# main deploy). Free tier, works with private repos.
#
# One-time setup (~ 3 minutes):
#   1. On your machine: cd operational-plan && npx vercel link
#      Follow the prompts to create/link a NEW Vercel project. Choose
#      "Other" for framework (no build). This creates .vercel/project.json
#      containing your orgId + projectId — DO NOT commit that folder.
#   2. Copy the two IDs from .vercel/project.json into repo secrets:
#        VERCEL_ORG_ID       = <orgId from project.json>
#        VERCEL_PROJECT_ID   = <projectId from project.json>
#   3. Create a Vercel token: vercel.com/account/tokens → Create Token.
#      Copy it into repo secret:
#        VERCEL_TOKEN        = <token>
#   4. Delete the local .vercel folder (it stays in gitignore anyway).
#
# Once secrets are in place, this workflow deploys on every push to
# main touching operational-plan/**.

name: Deploy operational plan — Vercel (dedicated)

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-operational-plan
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — bail out cleanly if secrets are missing
        id: preflight
        run: |
          missing=""
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping Vercel deploy — missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.preflight.outputs.skip != 'true'
        name: Install Vercel CLI
        run: npm install --global vercel@latest

      - if: steps.preflight.outputs.skip != 'true'
        name: Pull Vercel environment
        working-directory: operational-plan
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - if: steps.preflight.outputs.skip != 'true'
        name: Deploy operational-plan/ to Vercel production
        working-directory: operational-plan
        run: |
          # --prebuilt would skip build, but our operational-plan/ has no build
          # step — vercel serves the folder as-is per vercel.json.
          url=$(vercel deploy --prod --token="$VERCEL_TOKEN" --yes)
          echo "Deployed to: $url"
          echo "::notice::Live at $url"

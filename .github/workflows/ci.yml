name: Tweenz AI CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Stub required env vars so Next.js build succeeds without real credentials.
          # Real values are set in Vercel / production environment.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://tweenz.ae
          NEXT_PUBLIC_DEMO_MODE: "false"
          AI_PROVIDER: anthropic
          AI_MODEL: claude-sonnet-4-6

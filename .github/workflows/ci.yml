name: CI

on:
  push:
    branches: [main, "improvement/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
        env:
          AI_PROVIDER: mock

      - name: Production build
        run: npm run build
        env:
          AI_PROVIDER: mock
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

# Runs the operational-plan headless audit (Playwright + axe-core) on
# every push/PR that touches the deliverable. Non-zero exit on any P0
# (critical) finding blocks the merge. Non-P0 findings are surfaced in
# the job log and uploaded as an artifact for reviewer inspection.
#
# Add a Lighthouse job later if desired — kept out for now so runs stay
# fast and stable.
name: Operational Plan audit

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/operational-plan-audit.yml"
  pull_request:
    paths:
      - "operational-plan/**"
      - ".github/workflows/operational-plan-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-plan-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audit deps (Playwright + axe-core)
        # Install in /tmp so the workspace stays clean — matches the
        # local dev workflow documented in operational-plan/README.md.
        run: |
          mkdir -p /tmp/audit-deps
          cd /tmp/audit-deps
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund playwright axe-core@4

      - name: Install Chromium (Playwright)
        run: |
          cd /tmp/audit-deps
          npx playwright install --with-deps chromium

      - name: Patch audit script for CI paths
        # The audit script hard-codes /opt/node22/lib/node_modules/playwright
        # and /tmp/node_modules/axe-core. In CI both live under
        # /tmp/audit-deps/node_modules, so rewrite the two require paths
        # for the CI run only. Original file is untouched on disk after
        # the workflow ends because the workspace is discarded.
        run: |
          sed -i \
            -e "s|/opt/node22/lib/node_modules/playwright|/tmp/audit-deps/node_modules/playwright|" \
            -e "s|/tmp/node_modules/axe-core|/tmp/audit-deps/node_modules/axe-core|" \
            operational-plan/tests/audit.cjs

      - name: Run audit against current release (V0.6+)
        run: node operational-plan/tests/audit.cjs

      - name: Upload findings JSON
        # Non-fatal on purpose: the audit's own exit code is the merge gate.
        # A quota-full artifact upload should not fail an otherwise-green run.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: audit-findings
          path: /tmp/audit_findings.json
          if-no-files-found: warn
          retention-days: 7

name: Build Android APK

# بيبني الـ APK أوتوماتيك من غير Android Studio: اختبارات ثم بناء release.
# بيتشغّل لما تعدّل حاجة في android-wife-assistant/ أو يدوياً من تبويب Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # نرفع السر لمتغيّر بيئة لأن سياق secrets مش متاح في شرط if.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android-wife-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 1) اختبارات الوحدة (JUnit) قبل البناء — لو فشلت البناء بيقف.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # 2) توقيع اختياري: لو ضفت الأسرار بيتوقّع release حقيقي، غير كده debug.
      - name: Decode keystore (optional signing)
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      # 3) بناء نسخة release (APK قابل للتثبيت).
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ترقيم إصدار تلقائي متزايد من رقم البناء عشان تحديثات التطبيق تتثبّت فوق بعضها.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/release/app-release.apk ../wife-assistant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wife-assistant-apk
          path: wife-assistant.apk
          if-no-files-found: error

      # رابط تنزيل ثابت: أحدث APK دايماً على release واحد اسمه android-latest.
      - name: Publish rolling release (latest APK)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "أحدث نسخة APK (مساعد الرسايل)"
          body: |
            APK جاهز للتثبيت مباشرة على الموبايل.
            نزّل `wife-assistant.apk` من Assets تحت وثبّته.
            محتاج تسمح بتثبيت من "مصادر غير معروفة" أول مرة.
          files: wife-assistant.apk
          make_latest: true

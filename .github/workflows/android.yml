name: Build Android APK

# بيبني الـ APK أوتوماتيك من غير Android Studio.
# بيتشغّل لما تعدّل حاجة في android-wife-assistant/ أو يدوياً من تبويب Actions.
on:
  workflow_dispatch: # زر "Run workflow" اليدوي
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"

# عشان خطوة الـ release تقدر تكتب.
permissions:
  contents: write

# لو دفعت كذا مرة ورا بعض، يلغي القديم ويبني الأحدث بس.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wife-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk ../wife-assistant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wife-assistant-apk
          path: wife-assistant.apk
          if-no-files-found: error

      # رابط تنزيل ثابت: أحدث APK دايماً على release واحد اسمه android-latest.
      - name: Publish rolling release (latest APK)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "أحدث نسخة APK (مساعد الرسايل)"
          body: |
            APK جاهز للتثبيت مباشرة على الموبايل (نسخة debug).
            نزّل `wife-assistant.apk` من Assets تحت وثبّته.
            محتاج تسمح بتثبيت من "مصادر غير معروفة" أول مرة.
          files: wife-assistant.apk
          make_latest: true

# Deploys operational-plan/ to a DEDICATED Netlify site (separate from
# the existing symphonious-madeleine / gentle-sundae sites that don't
# have operational-plan/ in their publish path).
# Free tier, works with private repos.
#
# One-time setup (~ 2 minutes):
#   1. Create a Netlify account (app.netlify.com), free tier.
#   2. Netlify dashboard → Add new site → Deploy manually (or "Import
#      from Git" but disable auto-deploy — this workflow is the deploy
#      trigger). Name the site e.g. "operational-plan".
#   3. Note the SITE ID: site → Site settings → General → Site details →
#      copy "Site ID" (a uuid like abc-123-...).
#   4. Netlify → User settings → Applications → Personal access tokens →
#      New access token. Name it "GitHub Actions deploy". Copy it.
#   5. In THIS repo: Settings → Secrets and variables → Actions → New
#      repository secret. Add:
#        NETLIFY_AUTH_TOKEN = <token from step 4>
#        NETLIFY_SITE_ID    = <site id from step 3>
#
# Once secrets are in place, this workflow deploys on every push to
# main touching operational-plan/**.

name: Deploy operational plan — Netlify (dedicated)

on:
  push:
    branches: [main]
    paths:
      - "operational-plan/**"
      - ".github/workflows/deploy-operational-plan-netlify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-operational-plan
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — bail out cleanly if secrets are missing
        id: preflight
        run: |
          missing=""
          [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] && missing="$missing NETLIFY_AUTH_TOKEN"
          [ -z "${{ secrets.NETLIFY_SITE_ID }}" ] && missing="$missing NETLIFY_SITE_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping Netlify deploy — missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.preflight.outputs.skip != 'true'
        name: Install Netlify CLI
        run: npm install --global netlify-cli

      - if: steps.preflight.outputs.skip != 'true'
        name: Deploy operational-plan/ to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod --dir=operational-plan \
            --message="Deploy from GitHub Actions run ${{ github.run_number }} (${{ github.sha }})"

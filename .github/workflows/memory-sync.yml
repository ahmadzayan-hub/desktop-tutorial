name: Memory Sync (Agent-OS)

# 🗄️ Memory حيّة: بعد كل دمج على main، بنجدّد قسم "السجل التلقائي" في
# agent-os/memory/sessions-log.md من تاريخ Git، ونعمل commit لو فيه تغيير.
# حماية من الحلقة: بنتجاهل تعديلات ملف السجل نفسه (paths-ignore) + [skip ci].
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "agent-os/memory/sessions-log.md"

permissions:
  contents: write

concurrency:
  group: memory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # ما نشتغلش على الـ commit بتاع المزامنة نفسه (طبقة أمان زيادة فوق [skip ci]).
    if: ${{ !contains(github.event.head_commit.message, 'chore(memory)') }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild sessions log from git history
        run: node agent-os/memory/sync.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain agent-os/memory/sessions-log.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-os/memory/sessions-log.md
            git commit -m "chore(memory): sync sessions log [skip ci]"
            git push
          else
            echo "no changes to sessions log"
          fi

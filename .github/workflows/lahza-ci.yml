name: Lahza CI

# Typecheck + production build for the Lahza root Vite app on every PR and every
# push to main that touches the Lahza tree. Catches type regressions and build
# failures before they land, without needing manual runs from Actions.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "vercel.json"
      - ".github/workflows/lahza-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "vercel.json"
      - ".github/workflows/lahza-ci.yml"

permissions:
  contents: read

concurrency:
  group: lahza-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Upload build artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lahza-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

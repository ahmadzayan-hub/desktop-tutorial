<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src https://api.groq.com">
  <title>وصال — Wisal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- الشريط الجانبي (مناسب للّابتوب العريض) -->
    <aside class="sidebar">
      <div class="brand"><span class="logo">💗</span> <b>وصال</b></div>
      <nav id="nav">
        <button class="nav-item active" data-view="home">✨ الرئيسية</button>
        <button class="nav-item" data-view="people">👨‍👩‍👧‍👦 الأشخاص</button>
        <button class="nav-item" data-view="history">📜 السجل</button>
        <button class="nav-item" data-view="settings">⚙️ الإعدادات</button>
      </nav>
      <div class="side-foot">
        <div id="whoBadge" class="who-badge"></div>
        <button id="themeBtn" class="ghost small">🌓 الثيم</button>
      </div>
    </aside>

    <!-- المحتوى -->
    <main class="content">
      <section id="view-home" class="view"></section>
      <section id="view-people" class="view hidden"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
      <section id="view-onboard" class="view hidden"></section>
    </main>
  </div>

  <!-- نافذة أفكار المناسبة -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><b id="modalTitle"></b><button id="modalClose" class="ghost small">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>

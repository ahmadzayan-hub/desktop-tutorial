# Netlify build config — deploys the Beyond Coffee Moments storefront.
#
# This repo is a monorepo: the root is the "Beyond Style UAE" Next.js console,
# and beyond-coffee-moments/ is the Vite storefront. We build the sub-app
# explicitly and publish its dist/ folder.
#
# Notes:
# - No `base` is set, so `publish` is unambiguously relative to the repo root.
# - The command cd's into the sub-app and installs its own deps (incl. dev deps
#   tsc/vite), so the build never depends on Netlify's production-install mode.

[build]
  command = "cd beyond-coffee-moments && npm install --include=dev && npm run build"
  publish = "beyond-coffee-moments/dist"

[build.environment]
  NODE_VERSION = "20"
  # Ensure devDependencies (tsc, vite) are installed even if the site defaults
  # to a production install.
  NPM_CONFIG_PRODUCTION = "false"

# SPA fallback so client-side routes (/customize, /corporate, /console, …) work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache immutable hashed assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

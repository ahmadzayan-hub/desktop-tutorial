<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />

    <title>Beyond Style UAE | Elegant Fashion Accessories &amp; Gifts</title>
    <meta
      name="description"
      content="Elegant gold-tone and silver-tone fashion accessories in the UAE. Gift-ready bracelets and charms, fast WhatsApp ordering, cash on delivery, free delivery in Dubai over AED 200."
    />
    <link rel="canonical" href="https://beyondstyle.ae/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="keywords" content="fashion accessories UAE, gold-tone bracelet, silver-tone bracelet, Masha'Allah bracelet, gift jewellery Dubai, إكسسوارات, هدايا, أساور" />

    <!-- Language alternates -->
    <link rel="alternate" hreflang="ar" href="https://beyondstyle.ae/" />
    <link rel="alternate" hreflang="en" href="https://beyondstyle.ae/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://beyondstyle.ae/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beyond Style UAE" />
    <meta property="og:title" content="Beyond Style UAE | Elegant Fashion Accessories &amp; Gifts" />
    <meta property="og:description" content="Elegant gold-tone and silver-tone fashion accessories in the UAE. Gift-ready, fast WhatsApp ordering, delivery across the UAE." />
    <meta property="og:url" content="https://beyondstyle.ae/" />
    <meta property="og:image" content="https://beyondstyle.ae/og.svg" />
    <meta property="og:locale" content="ar_AE" />
    <meta property="og:locale:alternate" content="en_AE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beyond Style UAE" />
    <meta name="twitter:description" content="Elegant gold-tone and silver-tone fashion accessories in the UAE." />
    <meta name="twitter:image" content="https://beyondstyle.ae/og.svg" />

    <!-- Icons and PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beyond Style" />

    <!-- Apply the saved language before paint so there is no layout flip -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem("locale") || "ar";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: preconnect + swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data for search and answer engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Beyond Style UAE",
        "url": "https://beyondstyle.ae/",
        "logo": "https://beyondstyle.ae/icon.svg",
        "image": "https://beyondstyle.ae/og.svg",
        "description": "Elegant gold-tone and silver-tone fashion accessories in the UAE. Gift-ready bracelets and charms with fast WhatsApp ordering and delivery across the UAE.",
        "areaServed": { "@type": "Country", "name": "United Arab Emirates" },
        "currenciesAccepted": "AED",
        "paymentAccepted": "Cash on Delivery, Credit Card",
        "address": { "@type": "PostalAddress", "addressLocality": "Dubai", "addressCountry": "AE" },
        "parentOrganization": { "@type": "Organization", "name": "BEYOND CONNECT GENERAL TRADING L.L.C" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Beyond Style UAE",
        "url": "https://beyondstyle.ae/",
        "inLanguage": ["ar", "en"]
      }
    </script>
  </head>
  <body class="bg-ink text-cream font-ui antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
